
services:
  # يضيف/يشغّل phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"                 # ادخل من المتصفح: http://localhost:8080
    environment:
      PMA_HOST: ${DB_HOST:-mysql} # يقرأ من .env (افتراضي mysql)
      PMA_PORT: ${DB_PORT:-3306}
      PMA_USER: ${DB_USERNAME:-sail}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      UPLOAD_LIMIT: 512M
    depends_on:
      - mysql                     # تأكد أن خدمة DB اسمها mysql في ملف Sail الأساسي
    networks:
      - sail

